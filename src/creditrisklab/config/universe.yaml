# CreditRiskLab universe
#
# FACT DISCIPLINE
#   cik:            Quoted 10-digit strings (unquoted, YAML reads 0000020520 as octal).
#                   Each was located on SEC archive pages; `cli resolve` re-verifies every one
#                   against EDGAR's current or former registrant name before it is trusted.
#   default_date:   Chapter 11 petition date. Marked `verified: false` until confirmed.
#                   `cli verify-defaults` searches the issuer's full EDGAR history for the
#                   bankruptcy 8-K (Item 1.03) in a +/- 30 day window around the date and
#                   sets verified: true only when one is found.
#   Nothing in this file is used as ground truth until both flags are true.

meta:
  horizon_days: 365          # default within 12 months of the as-of date => label 1
  min_filing_lag_days: 0     # filings are used from their actual SEC `filed` date
  observation_window: ["2015-01-01", "2024-12-31"]

